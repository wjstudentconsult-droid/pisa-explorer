<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PISA Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#1d4ed8; --brand-soft:#dbeafe; --accent:#f59e0b; --good:#15803d; --bad:#b91c1c;
  --sel:#fff7ed;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:15px;line-height:1.55}
header{background:linear-gradient(120deg,#1e3a8a,#1d4ed8 60%,#0ea5e9);color:#fff;padding:18px 16px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.hrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:1.55rem;font-weight:700}
.sub{opacity:.9;font-size:.95rem;margin-top:2px}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang{display:inline-flex;background:rgba(255,255,255,.15);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.lang button.on{background:#fff;color:var(--brand)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1e40af;color:#fff}
.btn.green{background:#15803d;border-color:#15803d;color:#fff}
.btn.green:hover{background:#166534;color:#fff}
.btn.ghost-w{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);color:#fff}
.btn.sm{padding:5px 10px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{padding:20px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card h2{margin:0 0 4px;font-size:1.2rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.stat{background:var(--brand-soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.35rem;color:var(--brand)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;color:var(--ink)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
.rank-wrap{max-height:560px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:#f8fafc;position:sticky;top:0;z-index:1;font-weight:700}
th.l,td.l{text-align:left}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--brand)}
th.sorted{color:var(--brand)}
tbody tr:hover{background:#f8fafc}
tr.is-sel{background:var(--sel)!important}
tr.oecd{font-weight:700;background:#eef2ff}
.rank-tbl tbody tr{cursor:pointer}
.medal{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:0 4px;font-weight:700}
.m1{background:#fde68a}.m2{background:#e5e7eb}.m3{background:#fed7aa}
.pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}
.best{background:#dcfce7;font-weight:700}
.dim{background:#f1f5f9;font-weight:700;text-align:left;vertical-align:top}
.picker{position:relative;max-width:560px}
.picker input{width:100%;padding:11px 14px;font-size:1rem;border-radius:12px;border:2px solid var(--brand-soft)}
.picker input:focus{outline:none;border-color:var(--brand)}
.dd{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,.15);max-height:320px;overflow:auto;z-index:20;display:none}
.dd.show{display:block}
.dd .it{padding:8px 12px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;align-items:center}
.dd .it.act,.dd .it:hover{background:var(--brand-soft)}
.dd .it .nm small{display:block;color:var(--muted);font-size:.8rem}
.dd .it.picked{opacity:.5}
.badge{font-size:.72rem;padding:2px 8px;border-radius:999px;white-space:nowrap;font-weight:600}
.b-ok{background:#dcfce7;color:#166534}.b-old{background:#fef3c7;color:#92400e}.b-no{background:#f1f5f9;color:#64748b}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--brand-soft);color:#1e3a8a;border-radius:999px;padding:5px 6px 5px 12px;display:inline-flex;gap:6px;align-items:center;font-weight:600}
.chip button{border:0;background:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;color:#1e3a8a;font-weight:700;line-height:1}
.desc{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:14px}
.desc h3{margin:0 0 6px;font-size:1rem}
.desc ul{margin:6px 0;padding-left:20px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:16px}
@media (max-width:620px){.charts{grid-template-columns:1fr}}
.cc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;min-width:0}
.cc.wide{grid-column:1/-1}
.cc h3{margin:0;font-size:1.02rem}
.cc p{margin:2px 0 8px;color:var(--muted);font-size:.86rem}
.cc-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;font-size:.88rem}
.cc-ctrl select,.cc-ctrl input{padding:5px 8px;font-size:.88rem}
.cc-ctrl input[type=number]{width:70px}
.cc-body{position:relative;height:360px}
.hidden{display:none!important}
.empty{padding:30px;text-align:center;color:var(--muted)}
.note{font-size:.82rem;color:var(--muted);margin-top:10px}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:10px 16px 30px}
</style>
</head>
<body>
<header>
  <div class="wrap hrow">
    <div>
      <h1 id="tTitle"></h1>
      <div class="sub" id="tSub"></div>
    </div>
    <div class="hbtns">
      <div class="lang" role="group" aria-label="language">
        <button id="lnTh" class="on">ไทย</button>
        <button id="lnEn">English</button>
      </div>
      <button class="btn ghost-w" id="btnReset">⟲ <span id="tReset"></span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- Ranking -->
  <section class="card" id="secRank">
    <h2 id="tRankH"></h2>
    <div class="muted small" id="tRankSub"></div>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <label><span id="tSortBy"></span>
        <select id="sortSel"></select>
      </label>
      <span class="muted small" id="tRankHint"></span>
    </div>
    <div class="tbl-wrap rank-wrap"><table class="rank-tbl" id="rankTbl"></table></div>
    <div class="note" id="tRankNote"></div>
  </section>

  <!-- Selector -->
  <section class="card" id="secPick">
    <h2 id="tPickH"></h2>
    <div class="muted small" id="tPickSub"></div>
    <div class="toolbar">
      <div class="picker" style="flex:1;min-width:260px">
        <input type="text" id="q" autocomplete="off">
        <div class="dd" id="dd"></div>
      </div>
      <button class="btn sm" id="btnClear"></button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <!-- Import / update data -->
  <section class="card" id="secImport">
    <h2 id="tImpH"></h2>
    <div class="muted small" id="tImpSub"></div>
    <div class="toolbar">
      <button class="btn primary" id="btnImport">⬆ <span id="tImpBtn"></span></button>
      <input type="file" id="fileIn" accept=".xlsx,.xls,.csv" class="hidden">
      <button class="btn" id="btnTemplate">⬇ <span id="tTplBtn"></span></button>
      <button class="btn sm" id="btnClearImp"></button>
    </div>
    <div class="desc small" id="impInfo"></div>
  </section>

  <!-- Table -->
  <section class="card hidden" id="secTable">
    <div class="hrow">
      <div>
        <h2 id="tTblH"></h2>
        <div class="muted small" id="tTblSub"></div>
      </div>
      <div class="hbtns">
        <button class="btn green" id="btnXlsx">⬇ <span id="tXlsx"></span></button>
        <button class="btn primary" id="btnCharts">📊 <span id="tCharts"></span></button>
      </div>
    </div>
    <div class="tbl-wrap" style="margin-top:12px"><table id="cmpTbl"></table></div>
    <div class="desc" id="tblDesc"></div>
  </section>

  <!-- Charts -->
  <section class="card hidden" id="secCharts">
    <h2 id="tChH"></h2>
    <div class="muted small" id="tChSub"></div>
    <div class="charts" id="charts" style="margin-top:14px"></div>
  </section>
</main>
<footer id="tFoot"></footer>

<script>
/* =====================================================================

   Source: OECD PISA 2025 Results (Vol. I, released 8 Sep 2026),
           PISA 2022 Results (Vol. I), PISA 2018 Results (Vol. I)
   ===================================================================== */

const BASE_OECD = {2025:[463,461,482], 2022:[472,476,485], 2018:[489,487,489]};

const BASE_CAUTION = {2025:['AL','CA','NL','NZ','NO','US']};
const STORE_KEY = 'pisa_explorer_imports_v1';

/* Build working dataset = embedded base data + imported rows (kept in this browser) */
function rebuildData(){
  DATA = {}; OECD_AVG = {};
  for(const c in RAW) RAW[c].forEach((v,k)=>{ if(v){ (DATA[c]=DATA[c]||{})[BASE_YEARS[k]] = v.slice(); } });
  for(const y in BASE_OECD) OECD_AVG[y] = BASE_OECD[y].slice();
  CAUTION = {}; for(const y in BASE_CAUTION) CAUTION[y] = BASE_CAUTION[y].slice();
  const oecdGiven = {};
  for(const r of IMPORTED){
    if(r.code==='OECD'){ OECD_AVG[r.year] = r.v.slice(); oecdGiven[r.year]=true; continue; }
    (DATA[r.code]=DATA[r.code]||{})[r.year] = r.v.slice();
    if(r.caution){ (CAUTION[r.year]=CAUTION[r.year]||[]); if(!CAUTION[r.year].includes(r.code)) CAUTION[r.year].push(r.code); }
  }
  const ys = new Set(Object.keys(OECD_AVG).map(Number));
  for(const c in DATA) for(const y in DATA[c]) ys.add(+y);
  YEARS = [...ys].sort((a,b)=>a-b);
  // OECD average missing for an imported year → estimate from OECD members in the file
  for(const y of YEARS){
    if(OECD_AVG[y]) continue;
    OECD_AVG[y] = [0,1,2].map(i=>{ const v=OECD_MEMBERS.map(c=>DATA[c]?.[y]?.[i]).filter(x=>x!=null); return v.length? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : null; });
    OECD_AVG[y].estimated = true;
  }
  const withScores = YEARS.filter(y=>Object.keys(DATA).some(c=>DATA[c][y]));
  LATEST = withScores[withScores.length-1];
  PREV = withScores.length>1 ? withScores[withScores.length-2] : null;
  for(const k in _rankCache) delete _rankCache[k];
}
function loadImports(){ try{ IMPORTED = JSON.parse(localStorage.getItem(STORE_KEY)||'[]')||[]; }catch(e){ IMPORTED=[]; } }
function saveImports(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(IMPORTED)); return true; }catch(e){ return false; } }

let LANG = 'th';
const t = (k,vars)=>{
  let s=(T[LANG][k]??k);
  if(vars) for(const v in vars) s=s.split('{'+v+'}').join(vars[v]);
  if(typeof s==='string'){
    s=s.split('{Y}').join(LATEST).split('{P}').join(PREV??'–').split('{YS}').join(YEARS.join(' → '))
       .split('{YL}').join(YEARS.join(', ')).split('{N}').join(Object.keys(DATA).filter(hasLatest).length);
  }
  return s;
};

let dnTh=null, dnEn=null;
try{dnTh=new Intl.DisplayNames(['th'],{type:'region'});}catch(e){}
try{dnEn=new Intl.DisplayNames(['en'],{type:'region'});}catch(e){}
const EN_MAP = Object.fromEntries(COUNTRY_LIST.map(c=>[c.code,c.en]));
function thName(code){
  let n=null; try{ if(dnTh) n=dnTh.of(code);}catch(e){}
  if(!n||n===code) n=TH_FALLBACK[code]||EN_MAP[code]||code;
  return n;
}
function countryName(code){ return LANG==='th'?thName(code):(EN_MAP[code]||code); }
function pisaName(code){ const p=PISA_LABEL[code]; return p?p[LANG]:countryName(code); }

function score(code,year,i){
  if(year==null) return null;
  const y = code==='OECD' ? OECD_AVG[year] : DATA[code]?.[year];
  if(!y) return null;
  if(i===3){ if(y.slice(0,3).some(v=>v==null)) return null; return +((y[0]+y[1]+y[2])/3).toFixed(1); }
  return y[i] ?? null;
}
function participants(year,i){ return Object.keys(DATA).filter(c=>score(c,year,i)!=null); }
const _rankCache={};
function rankOf(code,year,i){
  const k=year+'_'+i; if(!_rankCache[k]){ const list=participants(year,i).map(c=>score(c,year,i)); _rankCache[k]=list; }
  const v=score(code,year,i); if(v==null) return null;
  return 1+_rankCache[k].filter(x=>x>v).length;
}
function nOf(year,i){ return participants(year,i).length; }
function pctOf(code,year,i){ const v=score(code,year,i); if(v==null) return null; const all=participants(year,i).map(c=>score(c,year,i)); return Math.round(100*all.filter(x=>x<v).length/all.length); }
function hasLatest(code){ return !!DATA[code]?.[LATEST]; }
function hasAny(code){ return !!DATA[code] && Object.keys(DATA[code]).length>0; }
function yearsOf(code){ return YEARS.filter(y=>DATA[code]?.[y]); }
const fmt = v => v==null? t('na') : (Number.isInteger(v)? String(v) : v.toFixed(1));
const fmtS = v => v==null? t('na') : (v>0?'+':v<0?'−':'±')+fmt(Math.abs(v));
const signCls = v => v==null? '' : v>0?'pos':v<0?'neg':'';
const diff=(a,b)=> (a==null||b==null)?null: +(a-b).toFixed(1);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const o=OECD_AVG[LATEST]||[];
  document.getElementById('stats').innerHTML=`
   <div class="stat"><b>${Object.keys(DATA).filter(hasLatest).length}</b>${t('stParticipants')}</div>
   <div class="stat"><b>${[0,1,2].map(i=>fmt(o[i]??null)).join(' / ')}</b>${t('stOecd')}${o.estimated?' *':''}</div>
   <div class="stat"><b style="font-size:1rem">${top(2)}</b>${t('stTopSci')}</div>
   <div class="stat"><b style="font-size:1rem">${top(0)}</b>${t('stTopMath')}</div>
   <div class="stat"><b style="font-size:1rem">${top(1)}</b>${t('stTopRead')}</div>`;
}
function renderSortSel(){
  const s=document.getElementById('sortSel');
  s.innerHTML=[2,0,1,3].map(i=>`<option value="${i}" ${i===SORT?'selected':''}>${t(SUBJ_KEYS[i])}</option>`).join('');
}
function rankingRows(){
  const codes=Object.keys(DATA).filter(hasLatest);
  return codes.sort((a,b)=>{
    const va=score(a,LATEST,SORT), vb=score(b,LATEST,SORT);
    if(va==null&&vb==null) return 0; if(va==null) return 1; if(vb==null) return -1; return vb-va;
  });
}
function renderRanking(){
  const tb=document.getElementById('rankTbl');
  const cols=[2,1,0,3];
  let h=`<thead><tr><th>${t('rank')}</th><th class="l">${t('country')}</th>`+
    cols.map(i=>`<th class="sortable ${i===SORT?'sorted':''}" data-s="${i}">${t(SUBJ_KEYS[i])}${i===SORT?' ▼':''}</th>`).join('')+
    `<th>${t('chg')} (${t(SUBJ_KEYS[SORT])})</th></tr></thead><tbody>`;
  for(const c of rankingRows()){
    const r=rankOf(c,LATEST,SORT);
    const medal=r&&r<=3?`<span class="medal m${r}">${r}</span>`:(r??'–');
    const cau=(CAUTION[LATEST]||[]).includes(c)?'*':'';
    const ch=diff(score(c,LATEST,SORT),score(c,PREV,SORT));
    h+=`<tr data-c="${c}" class="${SELECTED.includes(c)?'is-sel':''}"><td>${medal}</td><td class="l">${esc(pisaName(c))}${cau}</td>`+
      cols.map(i=>`<td>${fmt(score(c,LATEST,i))}</td>`).join('')+
      `<td class="${signCls(ch)}">${fmtS(ch)}</td></tr>`;
  }
  h+=`<tr class="oecd"><td></td><td class="l">${t('oecdAvg')}</td>`+cols.map(i=>`<td>${fmt(score('OECD',LATEST,i))}</td>`).join('')+
     `<td class="${signCls(diff(score('OECD',LATEST,SORT),score('OECD',PREV,SORT)))}">${fmtS(diff(score('OECD',LATEST,SORT),score('OECD',PREV,SORT)))}</td></tr></tbody>`;
  tb.innerHTML=h;
  tb.querySelectorAll('th.sortable').forEach(th=>th.onclick=()=>{SORT=+th.dataset.s;renderSortSel();renderRanking();});
  tb.querySelectorAll('tbody tr[data-c]').forEach(tr=>tr.onclick=()=>toggle(tr.dataset.c));
}

const qEl=document.getElementById('q'), ddEl=document.getElementById('dd');
let ddItems=[], ddAct=-1;
function searchCountries(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  const res=[];
  for(const c of COUNTRY_LIST){
    const names=[c.en, thName(c.code), PISA_LABEL[c.code]?.en||'', PISA_LABEL[c.code]?.th||''].map(s=>s.toLowerCase());
    const starts=names.some(n=>n.startsWith(q)||n.split(/[\s(\-]+/).some(w=>w&&w.startsWith(q)&&q.length>1));
    const incl=q.length>=2&&names.some(n=>n.includes(q));
    if(starts||incl) res.push({c, score: names.some(n=>n.startsWith(q))?0:1});
  }
  return res.sort((a,b)=>a.score-b.score||countryName(a.c.code).localeCompare(countryName(b.c.code),LANG)).map(r=>r.c);
}
function badge(code){
  if(hasLatest(code)) return `<span class="badge b-ok">${t('bOk')}</span>`;
  if(hasAny(code)) return `<span class="badge b-old">${t('bOld')}</span>`;
  return `<span class="badge b-no">${t('bNo')}</span>`;
}
function renderDD(){
  const list=searchCountries(qEl.value);
  ddItems=list; ddAct=list.length?0:-1;
  if(!qEl.value.trim()){ddEl.classList.remove('show');return;}
  if(!list.length){ddEl.innerHTML=`<div class="empty">${t('noMatch')}</div>`;ddEl.classList.add('show');return;}
  ddEl.innerHTML=list.map((c,i)=>{
    const sub=[]; if(LANG==='th') sub.push(c.en); else sub.push(thName(c.code));
    if(PISA_LABEL[c.code]&&PISA_LABEL[c.code][LANG]!==countryName(c.code)) sub.push('PISA: '+PISA_LABEL[c.code][LANG]);
    return `<div class="it ${i===ddAct?'act':''} ${SELECTED.includes(c.code)?'picked':''}" data-i="${i}">
      <span class="nm">${esc(countryName(c.code))}<small>${esc(sub.join(' · '))}</small></span>${SELECTED.includes(c.code)?'✓ ':''}${badge(c.code)}</div>`;
  }).join('');
  ddEl.classList.add('show');
  ddEl.querySelectorAll('.it').forEach(el=>el.onmousedown=e=>{e.preventDefault();pick(ddItems[+el.dataset.i].code);});
}
function moveAct(d){
  if(!ddItems.length) return; ddAct=(ddAct+d+ddItems.length)%ddItems.length;
  ddEl.querySelectorAll('.it').forEach((el,i)=>el.classList.toggle('act',i===ddAct));
  ddEl.querySelector('.it.act')?.scrollIntoView({block:'nearest'});
}
function pick(code){ if(!SELECTED.includes(code)) SELECTED.push(code); qEl.value=''; ddEl.classList.remove('show'); qEl.focus(); update(); }
function toggle(code){ const i=SELECTED.indexOf(code); if(i>=0) SELECTED.splice(i,1); else SELECTED.push(code); update(); }
qEl.addEventListener('input',renderDD);
qEl.addEventListener('focus',renderDD);
qEl.addEventListener('blur',()=>setTimeout(()=>ddEl.classList.remove('show'),120));
qEl.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();moveAct(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();moveAct(-1);}
  else if(e.key==='Enter'&&ddAct>=0){e.preventDefault();pick(ddItems[ddAct].code);}
  else if(e.key==='Escape'){ddEl.classList.remove('show');}
});
function renderChips(){
  document.getElementById('chips').innerHTML=SELECTED.map(c=>`<span class="chip">${esc(pisaName(c))} <button data-c="${c}" aria-label="remove">×</button></span>`).join('');
  document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>toggle(b.dataset.c));
}

   ===================================================================== */
function buildRows(){
  // returns [{dim, label, values:[...per selected + OECD], better:'high'|'low'|null, kind}]
  const cols=[...SELECTED,'OECD'];
  const rows=[];
  for(let i=0;i<4;i++){
    const dim=t(SUBJ_KEYS[i]);
    rows.push({dim,label:t('iMean',{y:LATEST}),better:'high',vals:cols.map(c=>score(c,LATEST,i))});
    rows.push({dim,label:t('iRank',{y:LATEST}),better:'low',vals:cols.map(c=>c==='OECD'?null:rankOf(c,LATEST,i)),
      show:(v)=>v==null?t('na'):`${v} / ${nOf(LATEST,i)}`});
    rows.push({dim,label:t('iDiff',{y:LATEST}),better:'high',signed:true,vals:cols.map(c=>c==='OECD'?0:diff(score(c,LATEST,i),score('OECD',LATEST,i)))});
    rows.push({dim,label:t('iPct',{y:LATEST}),better:'high',vals:cols.map(c=>c==='OECD'?null:pctOf(c,LATEST,i)),show:v=>v==null?t('na'):v+'%'});
    const earlier=YEARS.filter(y=>y<LATEST).reverse();
    for(const y of earlier){
      rows.push({dim,label:t('iMean',{y}),better:'high',vals:cols.map(c=>score(c,y,i))});
      rows.push({dim,label:t('iRank',{y}),better:'low',vals:cols.map(c=>c==='OECD'?null:rankOf(c,y,i)),show:(v)=>v==null?t('na'):`${v} / ${nOf(y,i)}`});
    }
    for(const y of earlier)
      rows.push({dim,label:t('iChg',{a:y,b:LATEST}),better:'high',signed:true,vals:cols.map(c=>diff(score(c,LATEST,i),score(c,y,i)))});
  }
  const dim=t('profile');
  const strongWeak=(c,fn)=>{ const v=[0,1,2].map(i=>score(c,LATEST,i)); if(v.some(x=>x==null)) return null; const k=fn(...v); return t(SUBJ_KEYS[v.indexOf(k)])+` (${k})`; };
  rows.push({dim,label:t('iStrong'),text:true,vals:cols.map(c=>strongWeak(c,Math.max))});
  rows.push({dim,label:t('iWeak'),text:true,vals:cols.map(c=>strongWeak(c,Math.min))});
  rows.push({dim,label:t('iGap'),better:null,vals:cols.map(c=>{const v=[0,1,2].map(i=>score(c,LATEST,i)); return v.some(x=>x==null)?null:Math.max(...v)-Math.min(...v);})});
  rows.push({dim,label:t('iOecd'),text:true,vals:cols.map(c=>c==='OECD'?t('na'):(OECD_MEMBERS.includes(c)?t('yes'):t('no')))});
  rows.push({dim,label:t('iCaution'),text:true,vals:cols.map(c=>c==='OECD'?t('na'):((CAUTION[LATEST]||[]).includes(c)?t('cautionYes'):t('na')))});
  rows.push({dim,label:t('iLabel'),text:true,vals:cols.map(c=>c==='OECD'?t('oecdAvg'):(hasAny(c)?pisaName(c):t('na')))});
  return {cols,rows};
}
function cellText(r,v){ if(r.text) return v??t('na'); if(r.show) return r.show(v); return r.signed?fmtS(v):fmt(v); }
function renderTable(){
  const {cols,rows}=buildRows();
  const head=`<thead><tr><th class="l">${t('dimension')}</th><th class="l">${t('indicator')}</th>`+
    cols.map(c=>`<th>${esc(c==='OECD'?t('oecdAvg'):pisaName(c))}</th>`).join('')+`</tr></thead>`;
  let body='<tbody>'; let lastDim=null;
  const dimCount={}; rows.forEach(r=>dimCount[r.dim]=(dimCount[r.dim]||0)+1);
  for(const r of rows){
    body+='<tr>';
    if(r.dim!==lastDim){ body+=`<td class="dim" rowspan="${dimCount[r.dim]}">${esc(r.dim)}</td>`; lastDim=r.dim; }
    body+=`<td class="l">${esc(r.label)}</td>`;
    let best=null;
    if(r.better&&SELECTED.length>1){
      const vs=r.vals.slice(0,SELECTED.length).filter(v=>v!=null);
      if(vs.length>1) best=r.better==='high'?Math.max(...vs):Math.min(...vs);
    }
    r.vals.forEach((v,j)=>{
      const cls=[r.signed?signCls(v):'', (best!=null&&v===best&&j<SELECTED.length)?'best':''].join(' ');
      body+=`<td class="${cls}">${esc(cellText(r,v))}</td>`;
    });
    body+='</tr>';
  }
  body+='</tbody>';
  document.getElementById('cmpTbl').innerHTML=head+body;
  document.getElementById('tTblSub').textContent = SELECTED.length===1? `${t('tblSub1')} ${pisaName(SELECTED[0])}` : t('tblSubN',{n:SELECTED.length});
  renderDesc();
}
function renderDesc(){
  const sums=SELECTED.map(c=>{
    if(!hasAny(c)) return t('noData',{c:esc(countryName(c))});
    if(!hasLatest(c)){ const ys=yearsOf(c).join(', '); return t('oldOnly',{c:esc(pisaName(c)),ys}); }
    const v=[0,1,2].map(i=>score(c,LATEST,i));
    if(v.some(x=>x==null)) return `<b>${esc(pisaName(c))}</b>: ${t('sci')} ${fmt(v[2])} (${t('rank')} ${rankOf(c,LATEST,2)}/${nOf(LATEST,2)})`;
    const above=v.filter((x,i)=>x>OECD_AVG[LATEST][i]).length;
    const cmp= above===3? t('above',{n:3}) : above===0? t('below',{n:3}) : t('mixed',{a:above,b:3-above});
    let trend;
    if(PREV==null||[0,1,2].every(i=>score(c,PREV,i)==null)) trend=t('trNo');
    else trend=[0,1,2].map(i=>{const d=diff(v[i],score(c,PREV,i)); return `${t(SUBJ_KEYS[i])} ${fmtS(d)}`;}).join(', ');
    const mx=Math.max(...v), mn=Math.min(...v);
    return t('sumLine',{c:esc(pisaName(c)),avg:fmt(score(c,LATEST,3)),r:`${rankOf(c,LATEST,3)}/${nOf(LATEST,3)}`,m:v[0],rd:v[1],s:v[2],st:t(SUBJ_KEYS[v.indexOf(mx)]),wk:t(SUBJ_KEYS[v.indexOf(mn)]),cmp,trend});
  });
  document.getElementById('tblDesc').innerHTML=`<h3>${t('descH')}</h3><p>${t('descDims')}</p>
   <div>${t('descIdx')}</div><ul>${T[LANG].descList.map(x=>`<li>${x}</li>`).join('')}</ul>
   ${SELECTED.length>1?`<p class="small muted">${t('descHL')}</p>`:''}
   <div>${t('descSum')}</div><ul>${sums.map(s=>`<li>${s}</li>`).join('')}</ul>
   <p class="small muted">${t('rankNote')}</p>`;
}

function exportExcel(){
  if(typeof XLSX==='undefined'){alert('Excel library failed to load (check internet connection).');return;}
  const {cols,rows}=buildRows();
  const aoa=[[t('dimension'),t('indicator'),...cols.map(c=>c==='OECD'?t('oecdAvg'):pisaName(c))]];
  rows.forEach(r=>aoa.push([r.dim,r.label,...r.vals.map(v=>{
    if(v==null) return '';
    if(r.text) return v;
    if(r.show) return r.show(v);
    return v;
  })]));
  aoa.push([]); aoa.push([t('foot')]);
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:18},{wch:40},...cols.map(()=>({wch:22}))];
  const rk=[[t('rank')+' ('+t(SUBJ_KEYS[SORT])+')',t('country'),t('math'),t('read'),t('sci'),t('avg'),t('chg')+' ('+t(SUBJ_KEYS[SORT])+')']];
  rankingRows().forEach(c=>rk.push([rankOf(c,LATEST,SORT)??'',pisaName(c),score(c,LATEST,0)??'',score(c,LATEST,1)??'',score(c,LATEST,2)??'',score(c,LATEST,3)??'',diff(score(c,LATEST,SORT),score(c,PREV,SORT))??'']));
  rk.push(['',t('oecdAvg'),...[0,1,2,3].map(i=>score('OECD',LATEST,i))]);
  const ws2=XLSX.utils.aoa_to_sheet(rk); ws2['!cols']=[{wch:10},{wch:34},{wch:12},{wch:12},{wch:12},{wch:14},{wch:18}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,t('xlsxSheet1').slice(0,31));
  XLSX.utils.book_append_sheet(wb,ws2,t('xlsxSheet2').slice(0,31));
  XLSX.writeFile(wb,`PISA_${LATEST}_${SELECTED.join('-')||'data'}.xlsx`);
}

let lastImpMsg = '';
const normName = s => String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/\*/g,'').replace(/[“”"']/g,'').replace(/\s+/g,' ').trim();
let NAME_IDX = null;
function nameIndex(){
  if(NAME_IDX) return NAME_IDX;
  NAME_IDX = {};
  const add=(n,c)=>{ const k=normName(n); if(k && !NAME_IDX[k]) NAME_IDX[k]=c; };
  for(const c of COUNTRY_LIST){ add(c.en,c.code); add(c.code,c.code); add(thName(c.code),c.code); try{ if(dnEn) add(dnEn.of(c.code),c.code);}catch(e){} }
  for(const c in PISA_LABEL){ add(PISA_LABEL[c].en,c); add(PISA_LABEL[c].th,c); }
  const alias={ 'oecd':'OECD','oecd average':'OECD','oecd avg':'OECD','ค่าเฉลี่ย oecd':'OECD',
    'korea':'KR','republic of korea':'KR','south korea':'KR','turkey':'TR','turkiye':'TR','czech republic':'CZ','slovak republic':'SK',
    'vietnam':'VN','viet nam':'VN','russian federation':'RU','united states of america':'US','usa':'US','uk':'GB',
    'b-s-j-z (china)':'CN','b-s-j-g (china)':'CN','beijing-shanghai-jiangsu-zhejiang (china)':'CN','chinese taipei':'TW',
    'hong kong (china)':'HK','hong kong sar':'HK','macao (china)':'MO','macau':'MO','macau (china)':'MO','brunei':'BN',
    'baku (azerbaijan)':'AZ','republic of moldova':'MD','moldova, republic of':'MD','republic of north macedonia':'MK','fyrom':'MK',
    'palestinian authority':'PS','kurdistan region (iraq)':'IQ','dushanbe (tajikistan)':'TJ','kosovo':'XK','laos':'LA','lao pdr':'LA',
    'iran, islamic republic of':'IR','cote divoire':'CI','swaziland':'SZ','holland':'NL' };
  for(const k in alias) NAME_IDX[k]=alias[k];
  return NAME_IDX;
}
function resolveCountry(codeVal,nameVal){
  const idx=nameIndex();
  if(codeVal!=null && String(codeVal).trim()){
    const c=String(codeVal).trim().toUpperCase();
    if(c==='OECD'||EN_MAP[c]) return c;
    if(idx[normName(codeVal)]) return idx[normName(codeVal)];
  }
  if(nameVal==null) return null;
  const n=normName(nameVal); if(!n) return null;
  if(idx[n]) return idx[n];
  if(n.startsWith('ukrainian')) return 'UA';
  if(n.startsWith('oecd')) return 'OECD';
  const stripped=n.replace(/\s*\(.*\)\s*$/,'').trim();   // "Something (Region)" → "Something"
  return idx[stripped]||null;
}
function pickCol(headers, keys){
  const H=headers.map(h=>normName(h).replace(/[^a-z0-9฀-๿]/g,''));
  for(const k of keys){ const i=H.findIndex(h=>h===k); if(i>=0) return headers[i]; }
  for(const k of keys){ const i=H.findIndex(h=>h.startsWith(k)); if(i>=0) return headers[i]; }
  return null;
}
const toNum = v => { if(v==null) return null; const s=String(v).replace(',', '.').replace(/[^\d.\-]/g,''); if(!s) return null; const n=+s; return isFinite(n)&&n>0? Math.round(n*10)/10 : null; };

function parseRows(rows){
  if(!rows.length) return {ok:[],skip:[]};
  const headers=Object.keys(rows.reduce((a,r)=>Object.assign(a,r),{}));
  const cYear=pickCol(headers,['year','ปี','cycle','รอบ']);
  const cCode=pickCol(headers,['code','iso','iso2','cnt','รหัส']);
  const cName=pickCol(headers,['country','countryeconomy','economy','name','ประเทศ','ชื่อ']);
  const cM=pickCol(headers,['mathematics','math','maths','คณิตศาสตร์','คณิต']);
  const cR=pickCol(headers,['reading','read','การอ่าน','อ่าน']);
  const cS=pickCol(headers,['science','sci','วิทยาศาสตร์','วิทย์']);
  const cC=pickCol(headers,['caution','flag','หมายเหตุ','ข้อควรระวัง']);
  if(!(cM||cR||cS) || !(cCode||cName)) return {ok:[],skip:[],bad:true};
  let defYear=null;
  if(!cYear){ const a=prompt(t('impAskYear'), String((LATEST||2025)+4)); defYear=parseInt(a,10); if(!defYear) return {ok:[],skip:[],cancel:true}; }
  const ok=[], skip=[];
  for(const r of rows){
    const year = cYear? parseInt(r[cYear],10) : defYear;
    const v=[toNum(cM&&r[cM]),toNum(cR&&r[cR]),toNum(cS&&r[cS])];
    if(!year || year<2000 || year>2100 || v.every(x=>x==null)) continue;
    const code=resolveCountry(cCode&&r[cCode], cName&&r[cName]);
    if(!code){ skip.push(String((cName&&r[cName])||(cCode&&r[cCode])||'?')); continue; }
    const caution = cC? /^(y|yes|true|1|\*|ใช่|x)$/i.test(String(r[cC]??'').trim()) : false;
    ok.push({year,code,v,caution});
  }
  return {ok,skip};
}
function handleFile(file){
  if(typeof XLSX==='undefined'){ alert('Excel library failed to load (check internet connection).'); return; }
  const fr=new FileReader();
  fr.onload=e=>{
    let rows=[];
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      // use the first sheet that yields usable rows
      let res=null;
      for(const sn of wb.SheetNames){
        rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:null,raw:true});
        const probe=Object.keys(rows[0]||{}).map(h=>normName(h));
        if(probe.some(h=>/math|read|scien|คณิต|อ่าน|วิทย/.test(h))){ res=parseRows(rows); break; }
      }
      if(!res) res={ok:[],skip:[],bad:true};
      if(res.cancel) return;
      if(!res.ok.length){ lastImpMsg=`<span class="neg">${t('impNoRows')}</span>`; renderImpInfo(); return; }
      // replace same (year, code) pairs
      const key=r=>r.year+'|'+r.code;
      const newKeys=new Set(res.ok.map(key));
      IMPORTED=IMPORTED.filter(r=>!newKeys.has(key(r))).concat(res.ok);
      const stored=saveImports();
      rebuildData();
      const ys=[...new Set(res.ok.map(r=>r.year))].sort();
      const msgs=[`<span class="pos">✓ ${t('impOk',{n:res.ok.length,ys:ys.join(', ')})}</span>`];
      ys.forEach(y=>{ if(OECD_AVG[y]?.estimated) msgs.push(t('impEst',{y})); });
      if(res.skip.length) msgs.push(`<span class="neg">${t('impSkip',{n:res.skip.length,list:esc(res.skip.slice(0,15).join(', '))+(res.skip.length>15?' …':'')})}</span>`);
      if(!stored) msgs.push(t('impNoStore'));
      lastImpMsg=msgs.join('<br>');
      renderAll();
    }catch(err){ lastImpMsg=`<span class="neg">Error: ${esc(err.message)}</span>`; renderImpInfo(); }
  };
  fr.readAsArrayBuffer(file);
}
function renderImpInfo(){
  const el=document.getElementById('impInfo'); if(!el) return;
  const ys=[...new Set(IMPORTED.map(r=>r.year))].sort();
  const status = IMPORTED.length? t('impHave',{n:IMPORTED.length,ys:ys.join(', ')}) : t('impNone');
  el.innerHTML = (lastImpMsg? `<div style="margin-bottom:8px">${lastImpMsg}</div>`:'') + `<div><b>${status}</b></div><div style="margin-top:6px">${t('impHow')}</div>`;
}
function downloadTemplate(){
  if(typeof XLSX==='undefined'){ alert('Excel library failed to load (check internet connection).'); return; }
  const ny=(LATEST||2025)+4;
  const head=['Year','Code','Country','Mathematics','Reading','Science','Caution'];
  const codes=Object.keys(DATA).filter(c=>hasLatest(c)).sort((a,b)=>(EN_MAP[a]||a).localeCompare(EN_MAP[b]||b));
  const fill=[head,[ny,'OECD','OECD average','','','',''],...codes.map(c=>[ny,c,PISA_LABEL[c]?.en||EN_MAP[c]||c,'','','',''])];
  const all=[head];
  for(const y of [...YEARS].reverse()){
    if(OECD_AVG[y]) all.push([y,'OECD','OECD average',...OECD_AVG[y].slice(0,3),'']);
    Object.keys(DATA).filter(c=>DATA[c][y]).sort().forEach(c=>all.push([y,c,PISA_LABEL[c]?.en||EN_MAP[c]||c,...DATA[c][y].map(v=>v??''),(CAUTION[y]||[]).includes(c)?'Y':'']));
  }
  const help=[[t('impH')],[],[t('impHow').replace(/<[^>]+>/g,'')],[],
    [LANG==='th'?'ขั้นตอน':'Steps'],
    [LANG==='th'?`1) เปิดชีต "${t('tplSheet')}" แล้วแก้ปีในคอลัมน์ Year ถ้าจำเป็น (ค่าเริ่มต้น ${ny})`:`1) Open the "${t('tplSheet')}" sheet and change the Year column if needed (default ${ny})`],
    [LANG==='th'?'2) กรอกคะแนน Mathematics / Reading / Science จากรายงาน OECD (แถวไหนไม่มีข้อมูลให้เว้นว่าง)':'2) Fill in Mathematics / Reading / Science from the OECD report (leave blank where not reported)'],
    [LANG==='th'?'3) เพิ่มแถวประเทศใหม่ได้ ใส่รหัส 2 ตัวอักษร หรือชื่อประเทศภาษาอังกฤษ':'3) You can add new countries: use the 2-letter code or the English country name'],
    [LANG==='th'?'4) บันทึกไฟล์ แล้วกด "นำเข้าข้อมูล" ในหน้าเว็บ':'4) Save the file and click "Import data" on the page'],
    [LANG==='th'?`ชีต "${t('tplAll')}" คือข้อมูลทั้งหมดที่มีอยู่ตอนนี้ ใช้เป็นตัวอย่างรูปแบบได้`:`The "${t('tplAll')}" sheet holds all current data and shows the expected format`]];
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.aoa_to_sheet(fill); ws1['!cols']=[{wch:8},{wch:8},{wch:32},{wch:13},{wch:11},{wch:11},{wch:9}];
  const ws2=XLSX.utils.aoa_to_sheet(all); ws2['!cols']=ws1['!cols'];
  const ws3=XLSX.utils.aoa_to_sheet(help); ws3['!cols']=[{wch:110}];
  XLSX.utils.book_append_sheet(wb,ws1,t('tplSheet'));
  XLSX.utils.book_append_sheet(wb,ws2,t('tplAll'));
  XLSX.utils.book_append_sheet(wb,ws3,t('tplHelp'));
  XLSX.writeFile(wb,`PISA_template_${ny}.xlsx`);
}
const fileIn=document.getElementById('fileIn');
document.getElementById('btnImport').onclick=()=>fileIn.click();
fileIn.onchange=()=>{ if(fileIn.files[0]) handleFile(fileIn.files[0]); fileIn.value=''; };
document.getElementById('btnTemplate').onclick=downloadTemplate;
document.getElementById('btnClearImp').onclick=()=>{
  if(!confirm(t('impConfirmClear'))) return;
  IMPORTED=[]; saveImports(); try{localStorage.removeItem(STORE_KEY);}catch(e){}
  lastImpMsg=''; rebuildData(); renderAll();
};

loadImports();
rebuildData();
renderAll();
</script>
